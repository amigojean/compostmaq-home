<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CompostMaq</title>
<meta name="description" content="CompostMaq — próximamente.">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f130f;
    --accent: #8fbf5f;
    --white: #eef2ea;
    --gray: #7a8a76;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'Space Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg);
    color: var(--white);
    font-family: var(--font-display), sans-serif;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .container { padding: 2rem; max-width: 640px; }
  .tag {
    font-family: var(--font-mono), monospace;
    color: var(--accent);
    font-size: 0.9rem;
    letter-spacing: 0.2em;
    margin-bottom: 1.5rem;
  }
  h1 {
    font-size: clamp(2.5rem, 9vw, 5rem);
    font-weight: 800;
    line-height: 1;
    margin-bottom: 1.2rem;
  }
  p {
    color: var(--gray);
    font-size: 1.1rem;
  }
  a {
    color: var(--accent);
  }
</style>
</head>
<body>
  <div class="container">
    <p class="tag">// PRÓXIMAMENTE</p>
    <h1>CompostMaq</h1>
    <p>Este sitio está en construcción.</p>
  </div>
</body>
</html>
